<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phil的小站</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="description" content="Phil的小站 —— 译文、思考，以及一切有趣或引人深思的事物。">
<style>
  :root{
    --bg:#fbfaf7;
    --ink:#2b2b2b;
    --ink-soft:#5a5a5a;
    --en:#8d8779;
    --rule:#e3dfd5;
    --accent:#8c3b3b;
    --card:#fffdf9;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",Georgia,"Times New Roman",serif;
    line-height:1.9;
    font-size:16px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:64px 26px 90px;}

  header{text-align:center;padding-bottom:36px;border-bottom:1px solid var(--rule);margin-bottom:40px;}
  .kicker{
    font-size:11px;letter-spacing:.28em;color:var(--accent);
    text-transform:uppercase;margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  }
  h1{font-size:38px;line-height:1.3;margin:0 0 14px;font-weight:700;letter-spacing:.02em;}
  .intro{
    font-size:15px;color:var(--ink-soft);margin:0 auto;max-width:520px;line-height:1.85;
  }
  .count{
    margin-top:18px;font-size:12.5px;color:var(--en);
    font-family:-apple-system,sans-serif;letter-spacing:.05em;
  }

  /* ---------- 文章卡片 ---------- */
  .item{
    position:relative;
    display:block;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:26px 28px;
    margin-bottom:20px;
    text-decoration:none;
    color:inherit;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .item:hover{
    border-color:#cfc7b6;
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(90,80,60,.07);
  }
  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--en);margin-bottom:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  }
  .badge{
    background:#f3ece6;color:var(--accent);
    padding:2px 9px;border-radius:10px;font-size:11px;letter-spacing:.04em;
  }
  .item h2{
    font-size:21px;margin:0 0 6px;font-weight:700;line-height:1.5;
  }
  .item:hover h2{color:var(--accent);}
  .sub{
    font-size:13.5px;color:var(--en);font-style:italic;margin:0 0 10px;
    font-family:Georgia,"Times New Roman",serif;
  }
  .desc{font-size:14.5px;color:var(--ink-soft);line-height:1.85;margin:0 0 14px;}
  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{
    font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--rule);border-radius:3px;padding:1px 8px;
    font-family:-apple-system,sans-serif;
  }
  .author{
    font-size:12px;color:var(--en);margin-top:12px;
    font-family:-apple-system,sans-serif;
  }
  .go{
    position:absolute;right:26px;bottom:24px;
    font-size:12.5px;color:var(--accent);
    font-family:-apple-system,sans-serif;
  }
  .item:hover .go{text-decoration:underline;}

  .empty{
    text-align:center;color:var(--en);font-size:14px;
    padding:50px 0;border:1px dashed var(--rule);border-radius:6px;
  }

  footer{
    margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);
    font-size:12px;color:var(--en);text-align:center;line-height:1.8;
    font-family:-apple-system,sans-serif;
  }
  footer a{color:var(--accent);text-decoration:none;}

  @media (max-width:680px){
    .wrap{padding:40px 18px 70px;}
    h1{font-size:29px;}
    .item{padding:22px 20px;}
    .go{position:static;display:block;margin-top:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Article</div>
    <h1>Phil的小站</h1>
    <p class="intro">译文、思考，以及一切有趣或引人深思的事物。</p>
    <div class="count" id="count"></div>
  </header>

  <main id="list"></main>
  <div class="empty" id="empty" hidden>还没有文章。在 <code>articles.js</code> 里加一条就有。</div>

  <footer>
    Phil的小站 · 始于 2026
  </footer>

</div>

<script src="articles.js"></script>
<script>
(function () {
  var list  = document.getElementById('list');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var data  = window.ARTICLES || [];

  // 转义，避免标题/简介里的特殊字符破坏结构
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  if (!data.length) {
    empty.hidden = false;
    return;
  }

  // 按日期倒序（新文章在前；缺日期的排在最后，保持原顺序）
  data.map(function (a, i) { return { a: a, i: i }; })
      .sort(function (x, y) {
        var dx = x.a.date || '', dy = y.a.date || '';
        if (dx === dy) return x.i - y.i;
        if (!dx) return 1;
        if (!dy) return -1;
        return dx < dy ? 1 : -1;
      })
      .forEach(function (w) { list.appendChild(card(w.a)); });

  count.textContent = '共 ' + data.length + ' 篇';

  function card(a) {
    var el = document.createElement('a');
    el.className = 'item';
    el.href = a.url;

    var tags = (a.tags || []).map(function (t) {
      return '<span class="tag">' + esc(t) + '</span>';
    }).join('');

    el.innerHTML =
      '<div class="meta">' +
        '<span>' + esc(a.date || '') + '</span>' +
        (a.badge ? '<span class="badge">' + esc(a.badge) + '</span>' : '<span></span>') +
      '</div>' +
      '<h2>' + esc(a.title) + '</h2>' +
      (a.subtitle ? '<p class="sub">' + esc(a.subtitle) + '</p>' : '') +
      (a.desc ? '<p class="desc">' + esc(a.desc) + '</p>' : '') +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (a.author ? '<div class="author">' + esc(a.author) + '</div>' : '') +
      '<span class="go">阅读 &rarr;</span>';

    return el;
  }
})();
</script>
</body>
</html>
